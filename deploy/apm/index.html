<!doctype html>
<html lang="ko"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>집나간 벌꿀오소리 · 서비스 현황</title>
<style>
:root{font-family:Inter,Pretendard,-apple-system,sans-serif;background:#0c111b;color:#edf2f7}*{box-sizing:border-box}body{margin:0;padding:28px;background:radial-gradient(circle at 15% 0,#153d54,transparent 33rem),#0c111b}main{max-width:1100px;margin:auto}h1{margin:5px 0;font-size:clamp(27px,5vw,42px)}.sub,.updated{color:#9eafc0}.sub{margin:0 0 26px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,section{background:#151d2a;border:1px solid #28374a;border-radius:16px;padding:18px}.label{color:#9eafc0;font-size:14px}.value{font-size:30px;font-weight:750;margin-top:7px}.bad{color:#ff7777}.warn{color:#ffc65a}.good{color:#5bd69b}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;margin-top:14px}section{min-width:0}h2{font-size:17px;margin:0 0 15px}.chart{height:176px;display:flex;align-items:end;gap:4px;border-bottom:1px solid #3a4b5f;padding-top:8px}.minute{flex:1;min-width:7px;height:100%;display:flex;align-items:end;gap:1px}.bar{flex:1;min-width:2px;border-radius:3px 3px 0 0}.success{background:#43c980}.error{background:#ed6262}table{width:100%;border-collapse:collapse;font-size:14px}th{color:#9eafc0;font-weight:500;text-align:left}th,td{padding:10px 5px;border-bottom:1px solid #28374a}td.path{overflow-wrap:anywhere}.empty{color:#9eafc0;text-align:center;padding:24px}.scroll{max-height:360px;overflow:auto;border:1px solid #28374a;border-radius:8px}.scroll table{min-width:720px}.scroll th{position:sticky;top:0;background:#151d2a}.clickable tbody tr{cursor:pointer}.clickable tbody tr:hover{background:#202c3b}.logs{max-height:420px;overflow:auto;margin:0;white-space:pre-wrap;word-break:break-word;background:#0c111b;border-radius:8px;padding:12px;font-size:12px}.updated{font-size:13px;margin-top:14px}@media(max-width:760px){body{padding:16px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
</style></head><body><main>
<h1>서비스 현황</h1><p class="sub" id="subtitle">Nginx 요청 로그를 불러오는 중입니다.</p>
<div class="cards"><div class="card"><div class="label">서비스 요청</div><div class="value" id="requests">-</div></div><div class="card"><div class="label">2xx 성공</div><div class="value good" id="successes">-</div></div><div class="card"><div class="label">4xx 오류</div><div class="value warn" id="client-errors">-</div></div><div class="card"><div class="label">5xx 서버 오류</div><div class="value bad" id="server-errors">-</div></div></div>
<div class="grid"><section><h2>분당 2xx 성공 · 5xx 서버 오류</h2><div class="chart" id="chart"></div></section><section><h2>요청 많은 경로</h2><div id="endpoints"></div></section><section><h2>최근 오류 · 4xx / 5xx</h2><div class="scroll clickable" id="errors"></div></section><section><h2>최근 API 요청 로그</h2><div class="scroll" id="api"></div></section><section><h2 id="trace-title">오류 스택트레이스</h2><pre class="logs" id="trace">오류 행을 선택하면 해당 요청의 백엔드 로그를 표시합니다.</pre></section><section><h2>1초 이상 느린 요청</h2><div id="slow"></div></section></div><p class="updated" id="updated"></p>
</main><script>
const $=id=>document.getElementById(id),time=v=>new Intl.DateTimeFormat("ko-KR",{hour:"2-digit",minute:"2-digit",second:"2-digit"}).format(new Date(v));
const table=(xs,cs)=>!xs.length?'<p class="empty">표시할 항목이 없습니다.</p>':`<table><thead><tr>${cs.map(c=>`<th>${c[0]}</th>`).join("")}</tr></thead><tbody>${xs.map(x=>`<tr>${cs.map(c=>`<td class="path">${c[1](x)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
function showTrace(requestId,logs){$("trace-title").textContent=`오류 스택트레이스 · ${requestId||"기존 로그"}`;if(!requestId){$("trace").textContent="이 요청은 추적 ID 도입 전 로그입니다.";return}const index=logs.findIndex(line=>line.includes(requestId));$("trace").textContent=index<0?"이 요청의 백엔드 로그는 새 백엔드 배포 후부터 표시됩니다.":logs.slice(index,index+80).join("\n")}
function render(d){if(!d.available){$("subtitle").textContent=d.message;return}$("subtitle").textContent=`최근 ${d.windowMinutes}분 · 5초마다 갱신 · 정적 파일 제외`;$("requests").textContent=d.requests.toLocaleString();$("successes").textContent=d.successes.toLocaleString();$("client-errors").textContent=d.clientErrors;$("server-errors").textContent=d.serverErrors;const max=Math.max(1,...d.series.flatMap(x=>[x.successes,x.serverErrors]));$("chart").innerHTML=d.series.map(x=>`<div class="minute" title="${time(x.timestamp)} · 2xx ${x.successes}건 · 5xx ${x.serverErrors}건"><div class="bar success" style="height:${x.successes/max*100}%"></div><div class="bar error" style="height:${x.serverErrors/max*100}%"></div></div>`).join("");$("endpoints").innerHTML=table(d.topEndpoints,[["경로",x=>x.path],["요청",x=>x.requests]]);const cols=[["시각",x=>time(x.timestamp)],["상태",x=>x.status],["요청",x=>`${x.method} ${x.path}`],["시간",x=>`${x.durationMs} ms`],["추적 ID",x=>x.requestId||"기존 로그"]];$("errors").innerHTML=table(d.recentErrors,cols);[...$("errors").querySelectorAll("tbody tr")].forEach((row,index)=>row.onclick=()=>showTrace(d.recentErrors[index].requestId,d.applicationLogs||[]));$("api").innerHTML=table(d.recentApiRequests,cols);$("slow").innerHTML=table(d.slowRequests,cols);$("updated").textContent=`마지막 집계: ${new Date(d.generatedAt).toLocaleString("ko-KR")}`}
async function refresh(){try{const r=await fetch("/apm/report.json",{cache:"no-store"});if(!r.ok)throw Error();render(await r.json())}catch{$("subtitle").textContent="APM 데이터를 불러오지 못했습니다."}}refresh();setInterval(refresh,5000);
</script></body></html>
