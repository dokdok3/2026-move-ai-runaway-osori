name: Deploy to EC2

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "compose.prod.yaml"
      - "deploy/**"
      - "scripts/deploy-blue-green.sh"
      - "scripts/write-deploy-status.sh"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}-frontend
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  DOCKER_BUILD_SUMMARY: "false"

jobs:
  deploy-production:
    name: Build and blue-green deploy
    if: vars.EC2_READY == 'true'
    runs-on: [self-hosted, Linux, X64, ec2, production]
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: deployment
        name: Start deployment status
        env:
          DEPLOY_ACTOR: ${{ github.actor }}
        run: |
          started_at="$(date +%s)"
          previous_image_file="$HOME/hackathon-deploy/.active-image-tag"
          previous_image=""
          if [[ -f "$previous_image_file" ]]; then
            previous_image="$(<"$previous_image_file")"
          elif [[ -f /var/www/hackathon-deploy/deploy-status.json ]] \
            && grep -q '"status": "success"' /var/www/hackathon-deploy/deploy-status.json; then
            previous_image="$(sed -n 's/.*"imageTag": "\([0-9a-f]\{40\}\)".*/\1/p' /var/www/hackathon-deploy/deploy-status.json | head -n 1)"
          fi
          if [[ "$previous_image" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$previous_image^{commit}" 2>/dev/null; then
            printf '%s\n' "$previous_image" > "$previous_image_file"
            changes="$(git log --reverse --format='%h %s' "$previous_image..$GITHUB_SHA")"
            changed_paths="$(git diff --name-only "$previous_image..$GITHUB_SHA")"
            backend_changed=false
            frontend_changed=false
            while IFS= read -r changed_path; do
              case "$changed_path" in
                backend/*) backend_changed=true ;;
                frontend/*) frontend_changed=true ;;
              esac
            done <<< "$changed_paths"
          else
            changes="$(git log -1 --format='%h %s' "$GITHUB_SHA")"
            previous_image=""
            backend_changed=true
            frontend_changed=true
          fi
          if [[ -z "$changes" ]]; then
            changes="$(git log -1 --format='%h %s' "$GITHUB_SHA")"
          fi
          active_color="none"
          active_color_file="$HOME/hackathon-deploy/.active-color"
          if [[ -f "$active_color_file" ]]; then
            active_color="$(<"$active_color_file")"
          fi
          case "$active_color" in
            blue) target_color="green" ;;
            green) target_color="blue" ;;
            none) target_color="blue" ;;
            *)
              echo "Invalid active color: $active_color" >&2
              exit 1
              ;;
          esac
          echo "started-at=$started_at" >> "$GITHUB_OUTPUT"
          echo "previous-image=$previous_image" >> "$GITHUB_OUTPUT"
          echo "backend-changed=$backend_changed" >> "$GITHUB_OUTPUT"
          echo "frontend-changed=$frontend_changed" >> "$GITHUB_OUTPUT"
          echo "active-color=$active_color" >> "$GITHUB_OUTPUT"
          echo "target-color=$target_color" >> "$GITHUB_OUTPUT"
          changes_b64="$(printf '%s' "$changes" | base64 | tr -d '\n')"
          echo "changes-b64=$changes_b64" >> "$GITHUB_OUTPUT"
          sudo install -d -o "$USER" -g "$USER" -m 755 /var/www/hackathon-deploy
          install -m 644 deploy/status/index.html /var/www/hackathon-deploy/index.html
          DEPLOY_STATUS_DIR=/var/www/hackathon-deploy DEPLOY_CHANGES="$changes" \
            scripts/write-deploy-status.sh building test unknown "$active_color" "$target_color" "$started_at"
      - uses: actions/setup-java@v5
        if: steps.deployment.outputs.backend-changed == 'true'
        with:
          distribution: temurin
          java-version: "25"
      - uses: pnpm/action-setup@v4
        if: steps.deployment.outputs.frontend-changed == 'true'
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        if: steps.deployment.outputs.frontend-changed == 'true'
        with:
          node-version: "22"
      - name: Verify and package changed applications
        env:
          BACKEND_CHANGED: ${{ steps.deployment.outputs.backend-changed }}
          FRONTEND_CHANGED: ${{ steps.deployment.outputs.frontend-changed }}
        run: |
          backend_pid=""
          frontend_pid=""
          if [[ "$BACKEND_CHANGED" == true ]]; then
            (cd backend && ./gradlew test bootJar --no-daemon) &
            backend_pid=$!
          fi
          if [[ "$FRONTEND_CHANGED" == true ]]; then
            (cd frontend && pnpm install --frozen-lockfile --prefer-offline && pnpm lint && pnpm build) &
            frontend_pid=$!
          fi

          failed=0
          if [[ -n "$backend_pid" ]] && ! wait "$backend_pid"; then
            echo "Backend verification failed" >&2
            failed=1
          fi
          if [[ -n "$frontend_pid" ]] && ! wait "$frontend_pid"; then
            echo "Frontend verification failed" >&2
            failed=1
          fi
          if [[ -z "$backend_pid" && -z "$frontend_pid" ]]; then
            echo "No application source changed; reusing previously published images"
          fi
          exit "$failed"
      - name: Mark image build status
        env:
          DEPLOY_ACTOR: ${{ github.actor }}
          DEPLOY_CHANGES_B64: ${{ steps.deployment.outputs.changes-b64 }}
        run: |
          DEPLOY_STATUS_DIR=/var/www/hackathon-deploy \
            scripts/write-deploy-status.sh building image-build "${GITHUB_SHA}" \
              '${{ steps.deployment.outputs.active-color }}' '${{ steps.deployment.outputs.target-color }}' \
              '${{ steps.deployment.outputs.started-at }}'
      - uses: docker/setup-buildx-action@v3
        with:
          name: production-builder
          keep-state: true
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build or retag images in parallel
        env:
          PREVIOUS_IMAGE: ${{ steps.deployment.outputs.previous-image }}
          BACKEND_CHANGED: ${{ steps.deployment.outputs.backend-changed }}
          FRONTEND_CHANGED: ${{ steps.deployment.outputs.frontend-changed }}
        run: |
          build_or_retag_backend() {
            if [[ "$BACKEND_CHANGED" == true ]]; then
              docker buildx build --builder production-builder --platform linux/amd64 \
                --provenance=mode=max --push --tag "$BACKEND_IMAGE:$GITHUB_SHA" ./backend
            else
              docker buildx imagetools create \
                --tag "$BACKEND_IMAGE:$GITHUB_SHA" "$BACKEND_IMAGE:$PREVIOUS_IMAGE"
            fi
          }
          build_or_retag_frontend() {
            if [[ "$FRONTEND_CHANGED" == true ]]; then
              docker buildx build --builder production-builder --platform linux/amd64 \
                --provenance=mode=max --push --tag "$FRONTEND_IMAGE:$GITHUB_SHA" ./frontend
            else
              docker buildx imagetools create \
                --tag "$FRONTEND_IMAGE:$GITHUB_SHA" "$FRONTEND_IMAGE:$PREVIOUS_IMAGE"
            fi
          }

          build_or_retag_backend &
          backend_pid=$!
          build_or_retag_frontend &
          frontend_pid=$!

          backend_status=0
          frontend_status=0
          wait "$backend_pid" || backend_status=$?
          wait "$frontend_pid" || frontend_status=$?
          if (( backend_status != 0 || frontend_status != 0 )); then
            echo "Image publication failed (backend=$backend_status, frontend=$frontend_status)" >&2
            exit 1
          fi
      - name: Mark images ready
        env:
          DEPLOY_ACTOR: ${{ github.actor }}
          DEPLOY_CHANGES_B64: ${{ steps.deployment.outputs.changes-b64 }}
        run: |
          DEPLOY_STATUS_DIR=/var/www/hackathon-deploy \
            scripts/write-deploy-status.sh deploying image-ready "${GITHUB_SHA}" \
              '${{ steps.deployment.outputs.active-color }}' '${{ steps.deployment.outputs.target-color }}' \
              '${{ steps.deployment.outputs.started-at }}'
      - name: Install deployment files
        run: |
          install -d "$HOME/hackathon-deploy/scripts" "$HOME/hackathon-deploy/deploy/nginx"
          install -m 644 compose.prod.yaml "$HOME/hackathon-deploy/compose.prod.yaml"
          install -m 755 scripts/deploy-blue-green.sh "$HOME/hackathon-deploy/scripts/deploy-blue-green.sh"
          install -m 755 scripts/write-deploy-status.sh "$HOME/hackathon-deploy/scripts/write-deploy-status.sh"
          install -m 644 deploy/nginx/hackathon.conf.template "$HOME/hackathon-deploy/deploy/nginx/hackathon.conf.template"
          sudo install -d -o "$USER" -g "$USER" -m 755 /var/www/hackathon-deploy
          install -m 644 deploy/status/index.html /var/www/hackathon-deploy/index.html
      - name: Switch blue-green deployment
        env:
          DEPLOY_ACTOR: ${{ github.actor }}
          DEPLOY_CHANGES_B64: ${{ steps.deployment.outputs.changes-b64 }}
          DEPLOY_IMAGE_TAG: ${{ github.sha }}
          DEPLOY_STARTED_AT: ${{ steps.deployment.outputs.started-at }}
        run: |
          cd "$HOME/hackathon-deploy"
          BACKEND_IMAGE="$BACKEND_IMAGE" FRONTEND_IMAGE="$FRONTEND_IMAGE" \
            scripts/deploy-blue-green.sh "$DEPLOY_IMAGE_TAG"
      - name: Mark deployment failure
        if: failure()
        env:
          DEPLOY_ACTOR: ${{ github.actor }}
          DEPLOY_CHANGES_B64: ${{ steps.deployment.outputs.changes-b64 }}
        run: |
          active_color='${{ steps.deployment.outputs.active-color }}'
          target_color='${{ steps.deployment.outputs.target-color }}'
          started_at='${{ steps.deployment.outputs.started-at }}'
          DEPLOY_STATUS_DIR=/var/www/hackathon-deploy \
            scripts/write-deploy-status.sh failed failed "${GITHUB_SHA}" \
              "${active_color:-none}" "${target_color:-none}" "${started_at:-$(date +%s)}"
      - name: Logout from GHCR
        if: always()
        run: docker logout ghcr.io || true
