<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>화물 정보 확인 · 집나간 벌꿀오소리</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="brand">
  <img src="logo.png" alt="집나간 벌꿀오소리 로고">
  <div>
    <div class="name">집나간 벌꿀오소리</div>
    <div class="tag">카카오모빌리티 물류 해커톤</div>
  </div>
</header>

<main>

  <section class="screen active">

    <div class="banner warn">
      <div class="ic">!</div>
      <div>AI가 <strong>6개 중 4개</strong>를 채웠어요. <strong>2개</strong>만 확인해주세요.</div>
    </div>

    <div class="card cargo-summary">
      <div class="cargo-summary__head">
        <h2 class="card-title">화물 정보</h2>
        <span class="cargo-summary__status">AI 변환</span>
      </div>
      <div class="cargo-summary__route">
        <div class="cargo-summary__place">
          <span class="cargo-summary__label">출발지</span>
          <strong class="cargo-summary__city">서울</strong>
          <time class="cargo-summary__time" datetime="2026-08-11T14:00">08/11 14:00</time>
        </div>
        <div class="cargo-summary__arrow" aria-hidden="true">→</div>
        <div class="cargo-summary__place">
          <span class="cargo-summary__label">도착지</span>
          <strong class="cargo-summary__city">부산</strong>
          <span class="badge warn">입력 필요</span>
        </div>
      </div>
      <div class="cargo-summary__meta">
        <span class="cargo-summary__type">냉장 · 5톤</span>
        <span class="cargo-summary__sep" aria-hidden="true"></span>
        <span class="cargo-summary__fare">운임 <span class="badge warn">입력 필요</span></span>
      </div>
    </div>

    <div class="card">
      <div class="card-title-row">
        <div class="card-title">화물 정보 수정</div>
        <span class="badge warn">2개 입력 필요</span>
      </div>

      <div class="form-row">
        <label class="area-label" for="from">출발지</label>
        <input class="field" id="from" type="text" value="서울">
      </div>

      <div class="form-row">
        <label class="area-label" for="depart-at">출발 일시</label>
        <input class="field" id="depart-at" type="datetime-local" value="2026-08-11T14:00">
      </div>

      <div class="form-row">
        <label class="area-label" for="to">도착지</label>
        <input class="field" id="to" type="text" value="부산">
      </div>

      <div class="form-row">
        <label class="area-label" for="arrive-at">도착 일시</label>
        <input class="field field-need" id="arrive-at" type="datetime-local" value="2026-08-11T18:00">
      </div>

      <div class="form-row">
        <label class="area-label" for="cargo-type">화물 종류</label>
        <select class="field" id="cargo-type">
          <option selected>냉장</option>
          <option>일반화물</option>
          <option>냉동</option>
          <option>위험물</option>
        </select>
      </div>

      <div class="form-row">
        <label class="area-label" for="weight">중량</label>
        <select class="field" id="weight">
          <option>1톤</option>
          <option>2.5톤</option>
          <option selected>5톤</option>
          <option>11톤</option>
          <option>22톤</option>
        </select>
      </div>

      <div class="form-row">
        <label class="area-label" for="fare">운임</label>
        <input class="field field-need" id="fare" type="number" inputmode="numeric"
               placeholder="예: 500000" step="10000">
        <p class="form-hint">이 구간 평균 운임은 <strong>720,000원</strong>이에요.</p>
      </div>
    </div>

    <div class="sticky-cta">
      <a class="btn ghost" href="shipper.html">다시 입력</a>
      <a class="btn primary" href="shipper-list.html">등록하기</a>
    </div>

  </section>

</main>

</body>
</html>
