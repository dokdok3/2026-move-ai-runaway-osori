<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>집나간 벌꿀오소리 · 시작하기</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="brand">
  <img src="logo.png" alt="집나간 벌꿀오소리 로고">
  <div>
    <div class="name">집나간 벌꿀오소리</div>
    <div class="tag">카카오모빌리티 물류 해커톤</div>
  </div>
</header>

<main>

  <section class="screen active">
    <div class="hero">
      <div class="eyebrow">✦ 시작하기</div>
      <h1>어떤 일로<br>오셨나요?</h1>
      <p>역할을 고르면 바로 그 화면으로 갑니다.</p>
    </div>

    <div class="pick">
      <a class="pick-btn" href="shipper-list.html">
        <svg class="pick-ic" viewBox="0 0 60 60" aria-hidden="true">
          <path class="fill" d="M30 9 L50 19 L50 41 L30 51 L10 41 L10 19 Z"/>
          <path class="st" d="M30 9 L50 19 L50 41 L30 51 L10 41 L10 19 Z"/>
          <path class="st" d="M10 19 L30 29 L50 19"/>
          <path class="st" d="M30 29 L30 51"/>
          <path class="st" d="M20 14 L40 24"/>
        </svg>
        <span>
          <span class="pick-tt">화주</span>
          <span class="pick-ds">화물을 맡기고 기사를 찾습니다</span>
        </span>
      </a>

      <a class="pick-btn" href="driver.html">
        <svg class="pick-ic" viewBox="0 0 60 60" aria-hidden="true">
          <path class="fill" d="M7 17 H34 V41 H7 Z"/>
          <path class="st" d="M7 41 V19 a2 2 0 0 1 2-2 H32 a2 2 0 0 1 2 2 V41"/>
          <path class="st" d="M34 26 H43 L52 35 V41"/>
          <path class="st" d="M7 41 H14 M24 41 H38 M48 41 H52"/>
          <circle class="st" cx="19" cy="43" r="5"/>
          <circle class="st" cx="43" cy="43" r="5"/>
        </svg>
        <span>
          <span class="pick-tt">기사</span>
          <span class="pick-ds">내 구간에 맞는 화물을 골라 받습니다</span>
        </span>
      </a>
    </div>
  </section>

</main>

<footer class="note">
  Hi-fi 목업 · 기사 등록 화면 없음 (mock 데이터 전제)
</footer>

</body>
</html>
