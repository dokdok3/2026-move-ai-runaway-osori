<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>화주 페이지 · 집나간 벌꿀오소리</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="brand">
  <img src="logo.png" alt="집나간 벌꿀오소리 로고">
  <div>
    <div class="name">집나간 벌꿀오소리</div>
    <div class="tag">카카오모빌리티 물류 해커톤</div>
  </div>
</header>

<main>

  <section class="screen active">
    <div class="hero">
      <div class="eyebrow">✦ AI로 빠른 매칭</div>
      <h1>화물 등록하고<br>3초 만에 기사 찾기</h1>
      <p>카톡 요청을 그대로 붙여넣으면 AI가 정리부터 매칭까지 끝내요.</p>
    </div>

    <div class="card">
      <div class="card-title-row"><div class="card-title">화물 요청 입력</div></div>
      <textarea class="field" rows="3" aria-label="화물 요청 원문"
        placeholder="예: 내일 서울→부산 냉장 5톤 예산 50만원"></textarea>
      <a class="btn primary" href="shipper-edit.html" style="width:100%;text-align:center;">AI 자동 변환</a>
    </div>

    <div class="input-divider"><span>또는</span></div>

    <a class="manual-entry-link" href="shipper-manual.html">
      <span>
        <strong>직접 입력하기</strong>
        <small>화물 정보를 항목별로 입력합니다</small>
      </span>
      <span class="manual-entry-link__arrow" aria-hidden="true">→</span>
    </a>

    <div class="frame-label">SCREEN 1 · 화주 페이지</div>
  </section>

</main>

<footer class="note">
  Hi-fi 목업 · 기사 등록 화면 없음 (mock 데이터 전제)
</footer>

</body>
</html>
